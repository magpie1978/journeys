<!-- ===================================================== -->
<!-- FLIGHTS BY TIME CHARTS                                -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Statistics – Flights</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing styles -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />

  <!-- OPTIONAL: page-specific tweak -->
  <style>
    .full-page {
      height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    .chart-fill {
      flex: 1;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .stats-nav {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    .stats-nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    .stats-nav a:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="statsHeader">
    <a href="index.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- MAIN -->
  <main id="statsPage">
    <div class="table-aligned-container">

      <!-- NAV BETWEEN CHART PAGES -->
      <div class="stats-nav">
        <a href="stats-flights.html">Flights</a>
        <a href="stats-airlines.html">Airlines</a>
        <a href="stats-airlines-year.html">Airlines by Year</a>
        <a href="stats-countries.html">Countries</a>
      </div>

      <!-- PAGE TITLE -->
      <h1>Flights Over Time</h1>

      <!-- CHART PANEL -->
      <section class="stats-panel full-page">

        <div class="panel-head">
          <div class="toggle-group">
            <button id="btnYear" class="toggle-btn active">Year</button>
            <button id="btnAllTime" class="toggle-btn">All Time</button>
          </div>

          <select id="metricSelector" class="stats-select">
            <option value="flights">Flights</option>
            <option value="miles">Miles</option>
          </select>
        </div>

        <div class="chart-card">
          <div class="chart-container scroll-y">
            <canvas id="flightsByYearChart"></canvas>
          </div>
        </div>
        
      </section>

    </div>
  </main>

  <!-- CONFIG + CHART LOGIC -->
  <script src="js/supabase.js"></script>
  <script src="js/chart-flights.js"></script>

</body>
</html>
