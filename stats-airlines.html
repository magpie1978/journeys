<!-- AIRLINES BY TIME CHARTS                               -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Statistics – Airlines</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing styles  -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />

  <!-- OPTIONAL: page-specific tweak -->
  <style>
    
    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .stats-nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }

    .stats-nav a:hover {
      color: #fff;
    }

    /* =====================================================
   AIRLINE MULTI-SELECT FILTER
===================================================== */

.airline-filter {
  position: relative;
  min-width: 220px;
  font-size: 14px;
}

.airline-filter-button {
  width: 100%;
  min-height: 40px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  padding: 0 14px;

  background: #151515;
  color: #fff;

  border: 1px solid #353535;
  border-radius: 10px;

  font: inherit;
  cursor: pointer;
}

.airline-filter-button:hover {
  border-color: #555;
}

.airline-filter-arrow {
  color: #aaa;
  font-size: 16px;
}

.airline-filter-menu {
  display: none;

  position: absolute;
  top: calc(100% + 6px);
  right: 0;

  width: 260px;
  max-height: 420px;

  overflow-y: auto;

  background: #15171d;

  border: 1px solid #353843;
  border-radius: 10px;

  box-shadow: 0 12px 30px rgba(0,0,0,0.45);

  z-index: 1000;
}

.airline-filter.open .airline-filter-menu {
  display: block;
}

.airline-filter-option {
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 9px 12px;

  color: rgba(255,255,255,0.75);

  cursor: pointer;
}

.airline-filter-option:hover {
  background: rgba(255,255,255,0.05);
  color: #fff;
}

.airline-filter-option input {
  accent-color: #CCFF00;
}

.airline-filter-all {
  color: #fff;

  border-bottom: 1px solid
    rgba(255,255,255,0.08);
}

    
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="statsHeader">
    <a href="index.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- MAIN -->
  <main id="statsPage">
    <div class="table-aligned-container">

      
<!-- AIRLINE FILTER -->
<div class="stats-top-controls">

  <div class="airline-filter" id="airlineFilter">

    <button
      type="button"
      class="airline-filter-button"
      id="airlineFilterButton"
    >
      <span id="airlineFilterLabel">All Airlines</span>
      <span class="airline-filter-arrow">⌄</span>
    </button>

    <div
      class="airline-filter-menu"
      id="airlineFilterMenu"
    >
      <label class="airline-filter-option airline-filter-all">
        <input
          type="checkbox"
          id="airlineFilterAll"
          checked
        >
        <span>All Airlines</span>
      </label>

      <div
        class="airline-filter-list"
        id="airlineFilterList"
      ></div>

    </div>

  </div>

</div>
      
      <!-- NAV BETWEEN CHART PAGES -->
      <div class="stats-nav">
        <a href="stats-flights.html">Flights</a>
        <a href="stats-airlines.html" class="active">Airlines</a>
        <a href="stats-airlines-year.html">Airlines by Year</a>
        <a href="stats-countries.html">Countries</a>
      </div>
      <!-- CHART PANEL -->
      <section class="stats-panel full-page">

        <div class="chart-card">
          <div class="chart-container scroll-y">
            <canvas id="flightsPerYearAirlineChart"></canvas>
          </div>
        </div>
        
      </section>

    </div>
  </main>

  <!-- CONFIG + CHART LOGIC -->
  <script src="js/supabase.js"></script>
  <script src="js/chart-airlines.js"></script>

</body>
</html>
