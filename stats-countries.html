<!-- COUNTRIES VISITS                                      -->
<!-- ===================================================== -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Statistics – Countries</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing styles -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />

  <!-- Page-specific styling  -->
  <style>
  
    /*
     * Keep the visible chart window at a fixed height.
     *
     * The complete country chart can be taller than this,
     * in which case the user can scroll vertically through it.
     */
    .chart-container.scroll-y {
      height: 680px;
      overflow-y: auto;
      overflow-x: hidden;
    }
  
  
    /*
     * Chart.js sizes the canvas from this inner container.
     *
     * JavaScript will increase this height according to the
     * number of countries being displayed.
     */
    #countryChartInner {
      position: relative;
      width: 100%;
      height: 680px;
    }
  
  
    /*
     * Make the Chart.js canvas completely fill the dynamically
     * sized inner container.
     */
    #visitsPerCountryChart {
      width: 100% !important;
      height: 100% !important;
    }
  
  
    .country-chart-toolbar { display: flex; align-items: center; gap: 14px; min-height: 36px; padding: 8px 14px; }
    #backToCountries { background: transparent; border: 1px solid #ccff00; border-radius: 6px; color: #ccff00; padding: 7px 12px; cursor: pointer; font: inherit; }
    #backToCountries:hover { background: rgba(204,255,0,.12); }
    #backToCountries[hidden], #countryChartHint[hidden] { display: none; }
    #countryChartHint { color: #999; font-size: 12px; }
    .stats-nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }
  
  
    .stats-nav a:hover {
      color: #fff;
    }
  
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="statsHeader">
    <a href="index.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- MAIN -->
  <main id="statsPage">
    <div class="table-aligned-container">

      <!-- RESERVED CONTROLS ROW -->
      <div class="stats-top-controls"></div>

      <!-- NAV BETWEEN CHART PAGES -->
      <div class="stats-nav">
        <a href="stats-flights.html">Flights</a>
        <a href="stats-airlines.html">Airlines</a>
        <a href="stats-airlines-year.html">Airlines by Year</a>
        <a href="stats-countries.html" class="active">Countries</a>
      </div>

      
      <!-- CHART PANEL -->
      <section class="stats-panel full-page">

        <div class="country-chart-toolbar">
          <button type="button" id="backToCountries" hidden>← All Countries</button>
          <span id="countryChartHint">Click a country name or bar to view visits by year</span>
        </div>

        <!-- SCROLLABLE CHART -->
        <div class="chart-card">
        
          <div class="chart-container scroll-y">
        
            <!--
              JavaScript increases the height of this element
              depending on how many countries need to be shown.
            -->
            <div id="countryChartInner">
        
              <canvas id="visitsPerCountryChart"></canvas>
        
            </div>
        
          </div>
        
        </div>
      </section>

    </div>
  </main>

  <!-- CONFIG + CHART LOGIC -->
  <script src="js/supabase.js"></script>
  <script src="js/chart-countries.js"></script>

</body>
</html>
