<!-- COUNTRIES VISITS                                      -->
<!-- ===================================================== -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Statistics – Countries</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing styles -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />

  <!-- Page-specific styling  -->
  <style>
  
    /*
     * Keep the visible chart window at a fixed height.
     *
     * The complete country chart can be taller than this,
     * in which case the user can scroll vertically through it.
     */
    .chart-container.scroll-y {
      height: 680px;
      overflow-y: auto;
      overflow-x: hidden;
    }
  
  
    /*
     * Chart.js sizes the canvas from this inner container.
     *
     * JavaScript will increase this height according to the
     * number of countries being displayed.
     */
    /* The yearly drill-down is a single, fully visible chart. */
    .chart-container.scroll-y.country-detail-view {
      height: 580px;
      overflow-y: hidden;
    }

    #countryChartInner {
      position: relative;
      width: 100%;
      height: 680px;
    }
  
  
    /*
     * Make the Chart.js canvas completely fill the dynamically
     * sized inner container.
     */
    #visitsPerCountryChart {
      width: 100% !important;
      height: 100% !important;
    }
  
  
    .country-chart-toolbar { display: flex; align-items: center; gap: 14px; min-height: 36px; padding: 8px 14px; }
    #backToCountries { background: transparent; border: 1px solid #ccff00; border-radius: 6px; color: #ccff00; padding: 7px 12px; cursor: pointer; font: inherit; }
    #backToCountries:hover { background: rgba(204,255,0,.12); }
    #backToCountries[hidden], #countryChartHint[hidden] { display: none; }
    #countryChartHint { color: #999; font-size: 12px; }
    .journey-type-menu { position: relative; margin-left: auto; z-index: 20; }
    #journeyTypeTrigger { color: #ddd; background: #1a1b20; border: 1px solid #383a43; border-radius: 7px; padding: 8px 12px; cursor: pointer; font: inherit; }
    #journeyTypePanel { position: absolute; right: 0; top: calc(100% + 5px); min-width: 210px; padding: 12px; background: #202128; border: 1px solid #454750; border-radius: 8px; box-shadow: 0 8px 25px #0009; }
    #journeyTypePanel[hidden] { display: none; }
    .journey-type-choice { display: block; color: #ddd; padding: 5px 0; cursor: pointer; white-space: nowrap; }
    .journey-type-choice input { accent-color: #ccff00; cursor: pointer; }
    .journey-type-actions { display: flex; gap: 8px; margin-bottom: 7px; }
    .journey-type-actions button { flex: 1; background: #30323a; border: 1px solid #51545e; border-radius: 5px; padding: 5px; color: #fff; cursor: pointer; }
    .stats-nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
    }
  
  
    .stats-nav a:hover {
      color: #fff;
    }
  
  </style>
</head>

<body>

  <!-- HEADER -->
  <header id="statsHeader">
    <a href="index.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- MAIN -->
  <main id="statsPage">
    <div class="table-aligned-container">

      <!-- RESERVED CONTROLS ROW -->
      <div class="stats-top-controls"></div>

      <!-- NAV BETWEEN CHART PAGES -->
      <div class="stats-nav">
        <a href="stats-flights.html">Flights</a>
        <a href="stats-airlines.html">Airlines</a>
        <a href="stats-airlines-year.html">Airlines by Year</a>
        <a href="stats-countries.html" class="active">Countries</a>
      </div>

      
      <!-- CHART PANEL -->
      <section class="stats-panel full-page">

        <div class="country-chart-toolbar">
          <button type="button" id="backToCountries" hidden>← All Countries</button>
          <span id="countryChartHint">Click a country name or bar to view visits by year</span>
          <label for="arrivalClassificationFilter" style="color:#ccc;font-size:13px;margin-left:auto">Arrivals</label>
          <select id="arrivalClassificationFilter" aria-label="Arrival classification" style="background:#1a1b20;color:#ddd;border:1px solid #383a43;border-radius:7px;padding:8px">
            <option value="counted">Visits + Transit</option>
            <option value="visit">Visits only</option>
            <option value="transit">Transit only</option>
            <option value="layover">Layovers only</option>
            <option value="all">All arrivals</option>
          </select>
          <div class="journey-type-menu" id="journeyTypeMenu" style="margin-left:0">
            <button id="journeyTypeTrigger" type="button" aria-expanded="false" aria-controls="journeyTypePanel">Journey Types ▾</button>
            <div id="journeyTypePanel" hidden>
              <div class="journey-type-actions">
                <button type="button" id="journeyTypesAll">Select All</button>
                <button type="button" id="journeyTypesNone">Clear All</button>
              </div>
              <div id="journeyTypeChoices"></div>
            </div>
          </div>
        </div>

        <!-- SCROLLABLE CHART -->
        <div class="chart-card">
        
          <div class="chart-container scroll-y">
        
            <!--
              JavaScript increases the height of this element
              depending on how many countries need to be shown.
            -->
            <div id="countryChartInner">
        
              <canvas id="visitsPerCountryChart"></canvas>
        
            </div>
        
          </div>
        
        </div>
      </section>

    </div>
  </main>

  <!-- CONFIG + CHART LOGIC -->
  <script src="js/supabase.js"></script>
  <script src="js/chart-countries.js"></script>

</body>
</html>
