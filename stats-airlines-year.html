<!-- ===================================================== -->
<!-- AIRLINES BY YEAR CHARTS                                -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Statistics – Airlines by Year</title>

  <!-- Chart.js  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing styles -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />

  <!-- Page-specific styling -->
  <style>
  
    /*
     * The chart card itself remains a sensible height.
     * If the chart is taller than this, the user scrolls
     * vertically inside the chart area.
     */
    .chart-container.scroll-y {
      height: 680px;
      overflow-y: auto;
      overflow-x: hidden;
    }
  
    /*
     * Chart.js will control the actual canvas height from
     * JavaScript, based on how many bars need to be shown.
     */
    #flightsPerAirlineYearChart {
      width: 100% !important;
    }
  
  
    .stats-nav {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
  
  
    .stats-nav a:hover {
      color: #fff;
    }
  
  </style>

</head>

<body>

  <!-- HEADER -->
  <header id="statsHeader">
    <a href="index.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <!-- MAIN -->
  <main id="statsPage">
    <div class="table-aligned-container">

      <!-- NAV BETWEEN CHART PAGES -->
      <div class="stats-nav">
        <a href="stats-flights.html">Flights</a>
        <a href="stats-airlines.html">Airlines</a>
        <a href="stats-airlines-year.html">Airlines by Year</a>
        <a href="stats-countries.html">Countries</a>
      </div>

      <!-- PAGE TITLE -->
      <h1>Airline Performance by Year</h1>

      <!-- CHART PANEL -->
      <section class="stats-panel full-page">

        <!-- HEADER WITH DROPDOWN -->
        <div class="panel-head">
          <h2>Airline Performance by Year</h2>

          <select id="airlineMetricSelect" class="stats-select">
            <option value="flights">Flights</option>
            <option value="miles">Miles</option>
            <option value="airlines">Airlines</option>
          </select>        
        </div>

        <!-- SCROLLABLE CHART -->
        <div class="chart-card">
        
          <!--
            This outer container stays at a fixed height.
            If the chart inside is taller, this container
            provides the vertical scrollbar.
          -->
          <div class="chart-container scroll-y">
        
            <!--
              JavaScript changes the height of THIS element
              depending on how many airlines are displayed.
            -->
            <div id="airlineChartInner">
        
              <canvas id="flightsPerAirlineYearChart"></canvas>
        
            </div>
        
          </div>
        
        </div>        
      </section>

    </div>
  </main>

  <!-- CONFIG + CHART LOGIC -->
  <script src="js/supabase.js"></script>
  <script src="js/chart-airlines-year.js"></script>

</body>
</html>
