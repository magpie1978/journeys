<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPX Journey Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: min(900px, 92vw);
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .description {
      color: #666;
      margin-bottom: 24px;
    }

    .journey-fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
    }

    .field input:focus {
      outline: none;
      border-color: #555;
    }

    .drop-zone {
      border: 2px dashed #aaa;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #333;
      background: #fafafa;
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    input[type="file"] {
      display: none;
    }

    .file-info {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      white-space: pre;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #e5e5e5;
      color: #222;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .count {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 650px) {
      .journey-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GPX Journey Converter</h1>

  <div class="description">
    Drop a GPX file below to convert its route coordinates into
    journey data with evenly distributed UTC times.
  </div>


  <!-- Journey details -->

  <div class="journey-fields">

    <div class="field">
      <label for="startTime">
        Start time
      </label>

      <input
        type="time"
        id="startTime"
        step="1"
      >
    </div>


    <div class="field">
      <label for="endTime">
        End time
      </label>

      <input
        type="time"
        id="endTime"
        step="1"
      >
    </div>


    <div class="field">
      <label for="callsign">
        Callsign
      </label>

      <input
        type="text"
        id="callsign"
        placeholder="e.g. EZY23JK"
        autocomplete="off"
      >
    </div>

  </div>


  <!-- GPX drop area -->

  <div class="drop-zone" id="dropZone">
    <strong>Drop GPX file here</strong>
    or click to select a file
  </div>

  <input
    type="file"
    id="fileInput"
    accept=".gpx,.xml"
  >


  <div
    class="file-info"
    id="fileInfo"
  ></div>


  <textarea
    id="output"
    placeholder="Converted journey data will appear here..."
    spellcheck="false"
  ></textarea>


  <div
    class="count"
    id="count"
  ></div>


  <div class="buttons">

    <button
      id="copyButton"
      disabled
    >
      Copy Data
    </button>

    <button
      id="downloadButton"
      disabled
    >
      Download TXT
    </button>

    <button
      class="secondary"
      id="clearButton"
    >
      Clear
    </button>

  </div>

</div>


<script>

const dropZone =
  document.getElementById("dropZone");

const fileInput =
  document.getElementById("fileInput");

const output =
  document.getElementById("output");

const fileInfo =
  document.getElementById("fileInfo");

const count =
  document.getElementById("count");

const startTimeInput =
  document.getElementById("startTime");

const endTimeInput =
  document.getElementById("endTime");

const callsignInput =
  document.getElementById("callsign");

const copyButton =
  document.getElementById("copyButton");

const downloadButton =
  document.getElementById("downloadButton");

const clearButton =
  document.getElementById("clearButton");


let currentFilename = "journey";

let storedCoordinates = [];


// -----------------------------------------
// File selection
// -----------------------------------------

dropZone.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  () => {

    if (fileInput.files.length) {

      processFile(
        fileInput.files[0]
      );

    }

  }
);


// -----------------------------------------
// Drag and drop
// -----------------------------------------

dropZone.addEventListener(
  "dragover",
  e => {

    e.preventDefault();

    dropZone.classList.add(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "drop",
  e => {

    e.preventDefault();

    dropZone.classList.remove(
      "dragover"
    );

    if (
      e.dataTransfer.files.length
    ) {

      processFile(
        e.dataTransfer.files[0]
      );

    }

  }
);


// -----------------------------------------
// Process GPX
// -----------------------------------------

function processFile(file) {

  const reader =
    new FileReader();


  reader.onload = function(e) {

    const text =
      e.target.result;

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "application/xml"
      );


    const parserError =
      xml.querySelector(
        "parsererror"
      );


    if (parserError) {

      alert(
        "This file could not be read as GPX/XML."
      );

      return;

    }


    const coordinates = [];

    const trackPoints =
      xml.getElementsByTagNameNS(
        "*",
        "trkpt"
      );


    for (
      const point
      of trackPoints
    ) {

      const lat =
        point.getAttribute(
          "lat"
        );

      const lon =
        point.getAttribute(
          "lon"
        );


      if (
        lat !== null &&
        lon !== null
      ) {

        coordinates.push({
          lon,
          lat
        });

      }

    }


    // -------------------------------------
    // If there are no track points,
    // try route points
    // -------------------------------------

    if (
      coordinates.length === 0
    ) {

      const routePoints =
        xml.getElementsByTagNameNS(
          "*",
          "rtept"
        );


      for (
        const point
        of routePoints
      ) {

        const lat =
          point.getAttribute(
            "lat"
          );

        const lon =
          point.getAttribute(
            "lon"
          );


        if (
          lat !== null &&
          lon !== null
        ) {

          coordinates.push({
            lon,
            lat
          });

        }

      }

    }


    if (
      coordinates.length === 0
    ) {

      storedCoordinates = [];

      output.value = "";

      count.textContent =
        "No coordinates found.";

      copyButton.disabled = true;

      downloadButton.disabled = true;

      return;

    }


    storedCoordinates =
      coordinates;


    fileInfo.textContent =
      file.name;


    currentFilename =
      file.name.replace(
        /\.[^.]+$/,
        ""
      ) + "-journey";


    generateOutput();

  };


  reader.readAsText(file);

}


// -----------------------------------------
// Generate journey dataset
// -----------------------------------------

function generateOutput() {

  if (
    storedCoordinates.length === 0
  ) {

    return;

  }


  const startValue =
    startTimeInput.value;

  const endValue =
    endTimeInput.value;

  const callsign =
    callsignInput.value.trim();


  if (
    !startValue ||
    !endValue
  ) {

    output.value = "";

    count.textContent =
      "Enter a start time and end time.";

    copyButton.disabled = true;

    downloadButton.disabled = true;

    return;

  }


  if (!callsign) {

    output.value = "";

    count.textContent =
      "Enter a callsign.";

    copyButton.disabled = true;

    downloadButton.disabled = true;

    return;

  }


  const startSeconds =
    timeToSeconds(
      startValue
    );

  let endSeconds =
    timeToSeconds(
      endValue
    );


  // If the end time is earlier than the
  // start time, assume the journey
  // crosses midnight.

  if (
    endSeconds < startSeconds
  ) {

    endSeconds +=
      24 * 60 * 60;

  }


  const duration =
    endSeconds -
    startSeconds;


  const numberOfPoints =
    storedCoordinates.length;


  let interval = 0;


  if (
    numberOfPoints > 1
  ) {

    interval =
      duration /
      (numberOfPoints - 1);

  }


  const rows = [];


  // Header

  rows.push(
    "timestamp,utc,callsign,position,altitude,speed,direction"
  );


  storedCoordinates.forEach(
    (coordinate, index) => {

      const currentSeconds =
        startSeconds +
        (interval * index);


      const utc =
        secondsToTime(
          currentSeconds
        );


      const position =
        `${coordinate.lon},${coordinate.lat}`;


      rows.push(
        `,${utc},${escapeField(callsign)},"${position}",,,`
      );

    }
  );


  output.value =
    rows.join("\n");


  count.textContent =
    `${numberOfPoints.toLocaleString()} journey rows generated`;


  copyButton.disabled = false;

  downloadButton.disabled = false;

}


// -----------------------------------------
// Convert HH:MM:SS to seconds
// -----------------------------------------

function timeToSeconds(value) {

  const parts =
    value.split(":");


  const hours =
    Number(parts[0]) || 0;

  const minutes =
    Number(parts[1]) || 0;

  const seconds =
    Number(parts[2]) || 0;


  return (
    hours * 3600 +
    minutes * 60 +
    seconds
  );

}


// -----------------------------------------
// Convert seconds to HH:MM:SS
// -----------------------------------------

function secondsToTime(seconds) {

  seconds =
    Math.round(seconds);


  // Allow journeys to cross midnight

  seconds =
    (
      seconds %
      (24 * 60 * 60)
      +
      (24 * 60 * 60)
    ) %
    (24 * 60 * 60);


  const hours =
    Math.floor(
      seconds / 3600
    );


  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );


  const secs =
    seconds % 60;


  return [
    String(hours).padStart(2, "0"),
    String(minutes).padStart(2, "0"),
    String(secs).padStart(2, "0")
  ].join(":");

}


// -----------------------------------------
// Escape CSV/TXT field
// -----------------------------------------

function escapeField(value) {

  const stringValue =
    String(value);


  if (
    stringValue.includes(",") ||
    stringValue.includes('"') ||
    stringValue.includes("\n")
  ) {

    return (
      '"' +
      stringValue.replace(
        /"/g,
        '""'
      ) +
      '"'
    );

  }


  return stringValue;

}


// -----------------------------------------
// Regenerate automatically when
// journey details change
// -----------------------------------------

startTimeInput.addEventListener(
  "change",
  generateOutput
);


endTimeInput.addEventListener(
  "change",
  generateOutput
);


callsignInput.addEventListener(
  "input",
  generateOutput
);


// -----------------------------------------
// Copy
// -----------------------------------------

copyButton.addEventListener(
  "click",
  async () => {

    await navigator.clipboard.writeText(
      output.value
    );


    const originalText =
      copyButton.textContent;


    copyButton.textContent =
      "Copied!";


    setTimeout(
      () => {

        copyButton.textContent =
          originalText;

      },
      1200
    );

  }
);


// -----------------------------------------
// Download TXT
// -----------------------------------------

downloadButton.addEventListener(
  "click",
  () => {

    const blob =
      new Blob(
        [output.value],
        {
          type:
            "text/plain;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;

    link.download =
      currentFilename + ".txt";


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    URL.revokeObjectURL(
      url
    );

  }
);


// -----------------------------------------
// Clear
// -----------------------------------------

clearButton.addEventListener(
  "click",
  () => {

    fileInput.value = "";

    startTimeInput.value = "";

    endTimeInput.value = "";

    callsignInput.value = "";

    storedCoordinates = [];

    output.value = "";

    fileInfo.textContent = "";

    count.textContent = "";

    copyButton.disabled = true;

    downloadButton.disabled = true;

    currentFilename =
      "journey";

  }
);

</script>

</body>
</html>
