<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPX Coordinate Extractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: min(800px, 92vw);
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .description {
      color: #666;
      margin-bottom: 24px;
    }

    .drop-zone {
      border: 2px dashed #aaa;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #333;
      background: #fafafa;
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    input[type="file"] {
      display: none;
    }

    .file-info {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
    }

    textarea {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #e5e5e5;
      color: #222;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .count {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GPX Coordinate Extractor</h1>

  <div class="description">
    Drop a GPX file below to extract its route coordinates as
    <strong>longitude,latitude</strong>.
  </div>

  <div class="drop-zone" id="dropZone">
    <strong>Drop GPX file here</strong>
    or click to select a file
  </div>

  <input type="file" id="fileInput" accept=".gpx,.xml">

  <div class="file-info" id="fileInfo"></div>

  <textarea
    id="output"
    placeholder="Extracted coordinates will appear here..."
    spellcheck="false"
  ></textarea>

  <div class="count" id="count"></div>

  <div class="buttons">
    <button id="copyButton" disabled>Copy Coordinates</button>
    <button id="downloadButton" disabled>Download TXT</button>
    <button class="secondary" id="clearButton">Clear</button>
  </div>

</div>

<script>

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const output = document.getElementById("output");
const fileInfo = document.getElementById("fileInfo");
const count = document.getElementById("count");

const copyButton = document.getElementById("copyButton");
const downloadButton = document.getElementById("downloadButton");
const clearButton = document.getElementById("clearButton");

let currentFilename = "coordinates";


// -----------------------------------------
// File selection
// -----------------------------------------

dropZone.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  if (fileInput.files.length) {
    processFile(fileInput.files[0]);
  }
});


// -----------------------------------------
// Drag and drop
// -----------------------------------------

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
  e.preventDefault();

  dropZone.classList.remove("dragover");

  if (e.dataTransfer.files.length) {
    processFile(e.dataTransfer.files[0]);
  }
});


// -----------------------------------------
// Process GPX
// -----------------------------------------

function processFile(file) {

  const reader = new FileReader();

  reader.onload = function(e) {

    const text = e.target.result;

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "application/xml");

    const parserError = xml.querySelector("parsererror");

    if (parserError) {
      alert("This file could not be read as GPX/XML.");
      return;
    }

    const trackPoints = xml.getElementsByTagNameNS("*", "trkpt");

    const coordinates = [];

    for (const point of trackPoints) {

      const lat = point.getAttribute("lat");
      const lon = point.getAttribute("lon");

      if (lat !== null && lon !== null) {
        coordinates.push(`${lon},${lat}`);
      }
    }


    // Also check route points if no track points exist

    if (coordinates.length === 0) {

      const routePoints = xml.getElementsByTagNameNS("*", "rtept");

      for (const point of routePoints) {

        const lat = point.getAttribute("lat");
        const lon = point.getAttribute("lon");

        if (lat !== null && lon !== null) {
          coordinates.push(`${lon},${lat}`);
        }
      }
    }


    if (coordinates.length === 0) {
      output.value = "";
      count.textContent = "No coordinates found.";
      copyButton.disabled = true;
      downloadButton.disabled = true;
      return;
    }


    output.value = coordinates.join("\n");

    fileInfo.textContent = file.name;

    count.textContent =
      `${coordinates.length.toLocaleString()} coordinate pairs extracted`;

    copyButton.disabled = false;
    downloadButton.disabled = false;

    currentFilename =
      file.name.replace(/\.[^.]+$/, "") + "-coordinates";
  };

  reader.readAsText(file);
}


// -----------------------------------------
// Copy
// -----------------------------------------

copyButton.addEventListener("click", async () => {

  await navigator.clipboard.writeText(output.value);

  const originalText = copyButton.textContent;

  copyButton.textContent = "Copied!";

  setTimeout(() => {
    copyButton.textContent = originalText;
  }, 1200);

});


// -----------------------------------------
// Download
// -----------------------------------------

downloadButton.addEventListener("click", () => {

  const blob = new Blob(
    [output.value],
    { type: "text/plain;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = currentFilename + ".txt";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);

});


// -----------------------------------------
// Clear
// -----------------------------------------

clearButton.addEventListener("click", () => {

  fileInput.value = "";
  output.value = "";
  fileInfo.textContent = "";
  count.textContent = "";

  copyButton.disabled = true;
  downloadButton.disabled = true;

});

</script>

</body>
</html>
