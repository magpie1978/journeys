<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GPX Journey Converter</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f5f7;

      font-family: Arial, sans-serif;
      color: #222;
    }


    .container {
      width: min(1000px, 92vw);

      background: white;

      border-radius: 12px;

      padding: 32px;

      box-shadow:
        0 4px 20px rgba(0,0,0,0.08);
    }


    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }


    .description {
      color: #666;

      margin-bottom: 24px;

      line-height: 1.5;
    }


    /* =========================================
       JOURNEY DETAILS
    ========================================= */


    .journey-fields {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      margin-bottom: 22px;
    }


    .field {
      display: flex;

      flex-direction: column;

      gap: 6px;
    }


    .field label {
      font-size: 13px;

      font-weight: bold;

      color: #444;
    }


    .field input {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #ccc;

      border-radius: 7px;

      font-family: inherit;

      font-size: 14px;

      background: white;
    }


    .field input:focus {
      outline: none;

      border-color: #555;

      box-shadow:
        0 0 0 2px rgba(0,0,0,0.05);
    }


    /* =========================================
       DROP ZONE
    ========================================= */


    .drop-zone {
      border: 2px dashed #aaa;

      border-radius: 10px;

      padding: 40px 20px;

      text-align: center;

      cursor: pointer;

      transition: 0.2s;
    }


    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #333;

      background: #fafafa;
    }


    .drop-zone strong {
      display: block;

      margin-bottom: 8px;

      font-size: 18px;
    }


    input[type="file"] {
      display: none;
    }


    /* =========================================
       FILE INFORMATION
    ========================================= */


    .file-info {
      margin-top: 18px;

      font-size: 14px;

      color: #555;
    }


    /* =========================================
       OUTPUT
    ========================================= */


    textarea {
      width: 100%;

      height: 340px;

      margin-top: 20px;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-family: monospace;

      font-size: 13px;

      line-height: 1.5;

      resize: vertical;

      white-space: pre;

      overflow: auto;
    }


    .count {
      margin-top: 12px;

      font-size: 13px;

      color: #666;
    }


    /* =========================================
       BUTTONS
    ========================================= */


    .buttons {
      display: flex;

      gap: 10px;

      margin-top: 14px;

      flex-wrap: wrap;
    }


    button {
      border: 0;

      border-radius: 7px;

      padding: 11px 18px;

      cursor: pointer;

      font-size: 14px;

      background: #222;

      color: white;
    }


    button:hover:not(:disabled) {
      background: #444;
    }


    button.secondary {
      background: #e5e5e5;

      color: #222;
    }


    button.secondary:hover:not(:disabled) {
      background: #d7d7d7;
    }


    button:disabled {
      opacity: 0.4;

      cursor: default;
    }


    /* =========================================
       RESPONSIVE
    ========================================= */


    @media (max-width: 800px) {

      .journey-fields {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 500px) {

      .journey-fields {
        grid-template-columns: 1fr;
      }


      .container {
        padding: 22px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    GPX Journey Converter
  </h1>


  <div class="description">

    Enter the journey date, start time, end time and callsign,
    then drop a GPX file below.

    The GPX points will be assigned evenly spaced UTC timestamps
    across the journey.

  </div>


  <!-- =======================================
       JOURNEY DETAILS
  ======================================== -->


  <div class="journey-fields">


    <div class="field">

      <label for="journeyDate">
        Journey date
      </label>

      <input
        type="date"
        id="journeyDate"
      >

    </div>


    <div class="field">

      <label for="startTime">
        Start time (UTC)
      </label>

      <input
        type="time"
        id="startTime"
        step="1"
      >

    </div>


    <div class="field">

      <label for="endTime">
        End time (UTC)
      </label>

      <input
        type="time"
        id="endTime"
        step="1"
      >

    </div>


    <div class="field">

      <label for="callsign">
        Callsign
      </label>

      <input
        type="text"
        id="callsign"
        placeholder="e.g. EZY23JK"
        autocomplete="off"
      >

    </div>


  </div>


  <!-- =======================================
       GPX DROP ZONE
  ======================================== -->


  <div
    class="drop-zone"
    id="dropZone"
  >

    <strong>
      Drop GPX file here
    </strong>

    or click to select a file

  </div>


  <input
    type="file"
    id="fileInput"
    accept=".gpx,.xml"
  >


  <div
    class="file-info"
    id="fileInfo"
  ></div>


  <!-- =======================================
       OUTPUT
  ======================================== -->


  <textarea
    id="output"
    placeholder="Converted journey data will appear here..."
    spellcheck="false"
  ></textarea>


  <div
    class="count"
    id="count"
  ></div>


  <div class="buttons">


    <button
      id="copyButton"
      disabled
    >
      Copy Data
    </button>


    <button
      id="downloadButton"
      disabled
    >
      Download TXT
    </button>


    <button
      class="secondary"
      id="reverseButton"
      disabled
    >
      Reverse Data
    </button>


    <button
      class="secondary"
      id="clearButton"
    >
      Clear
    </button>


  </div>


</div>


<script>


/* =============================================
   ELEMENTS
============================================= */


const dropZone =
  document.getElementById(
    "dropZone"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );


const output =
  document.getElementById(
    "output"
  );


const fileInfo =
  document.getElementById(
    "fileInfo"
  );


const count =
  document.getElementById(
    "count"
  );


const journeyDateInput =
  document.getElementById(
    "journeyDate"
  );


const startTimeInput =
  document.getElementById(
    "startTime"
  );


const endTimeInput =
  document.getElementById(
    "endTime"
  );


const callsignInput =
  document.getElementById(
    "callsign"
  );


const copyButton =
  document.getElementById(
    "copyButton"
  );


const downloadButton =
  document.getElementById(
    "downloadButton"
  );


const reverseButton =
  document.getElementById(
    "reverseButton"
  );


const clearButton =
  document.getElementById(
    "clearButton"
  );


/* =============================================
   STATE
============================================= */


let currentFilename =
  "journey";


let storedCoordinates =
  [];


let isReversed =
  false;


/* =============================================
   FILE SELECTION
============================================= */


dropZone.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  () => {

    if (
      fileInput.files.length
    ) {

      processFile(
        fileInput.files[0]
      );

    }

  }
);


/* =============================================
   DRAG AND DROP
============================================= */


dropZone.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

    dropZone.classList.add(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "dragleave",
  () => {

    dropZone.classList.remove(
      "dragover"
    );

  }
);


dropZone.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    dropZone.classList.remove(
      "dragover"
    );


    if (
      event.dataTransfer.files.length
    ) {

      processFile(
        event.dataTransfer.files[0]
      );

    }

  }
);


/* =============================================
   PROCESS GPX
============================================= */


function processFile(
  file
) {


  const reader =
    new FileReader();


  reader.onload =
    function(
      event
    ) {


      const text =
        event.target.result;


      const parser =
        new DOMParser();


      const xml =
        parser.parseFromString(
          text,
          "application/xml"
        );


      const parserError =
        xml.querySelector(
          "parsererror"
        );


      if (
        parserError
      ) {

        alert(
          "This file could not be read as GPX/XML."
        );

        return;

      }


      const coordinates =
        [];


      /* -------------------------------------
         TRACK POINTS
      ------------------------------------- */


      const trackPoints =
        xml.getElementsByTagNameNS(
          "*",
          "trkpt"
        );


      for (
        const point
        of trackPoints
      ) {


        const lat =
          point.getAttribute(
            "lat"
          );


        const lon =
          point.getAttribute(
            "lon"
          );


        if (
          lat !== null &&
          lon !== null
        ) {

          coordinates.push({
            lat,
            lon
          });

        }

      }


      /* -------------------------------------
         ROUTE POINTS

         Use these only if there are no
         track points in the GPX file.
      ------------------------------------- */


      if (
        coordinates.length === 0
      ) {


        const routePoints =
          xml.getElementsByTagNameNS(
            "*",
            "rtept"
          );


        for (
          const point
          of routePoints
        ) {


          const lat =
            point.getAttribute(
              "lat"
            );


          const lon =
            point.getAttribute(
              "lon"
            );


          if (
            lat !== null &&
            lon !== null
          ) {

            coordinates.push({
              lat,
              lon
            });

          }

        }

      }


      /* -------------------------------------
         NO COORDINATES
      ------------------------------------- */


      if (
        coordinates.length === 0
      ) {


        storedCoordinates =
          [];


        output.value =
          "";


        fileInfo.textContent =
          file.name;


        count.textContent =
          "No coordinates found.";


        copyButton.disabled =
          true;


        downloadButton.disabled =
          true;


        reverseButton.disabled =
          true;


        return;

      }


      /* -------------------------------------
         STORE GPX DATA
      ------------------------------------- */


      storedCoordinates =
        coordinates;


      isReversed =
        false;


      reverseButton.textContent =
        "Reverse Data";


      reverseButton.disabled =
        false;


      fileInfo.textContent =
        file.name;


      currentFilename =
        file.name.replace(
          /\.[^.]+$/,
          ""
        )
        +
        "-journey";


      generateOutput();

    };


  reader.readAsText(
    file
  );

}


/* =============================================
   GENERATE DATASET
============================================= */


function generateOutput() {


  if (
    storedCoordinates.length === 0
  ) {

    return;

  }


  const journeyDate =
    journeyDateInput.value;


  const startValue =
    startTimeInput.value;


  const endValue =
    endTimeInput.value;


  const callsign =
    callsignInput
      .value
      .trim();


  /* -----------------------------------------
     VALIDATION
  ----------------------------------------- */


  if (
    !journeyDate ||
    !startValue ||
    !endValue
  ) {


    output.value =
      "";


    count.textContent =
      "Enter a journey date, start time and end time.";


    copyButton.disabled =
      true;


    downloadButton.disabled =
      true;


    return;

  }


  if (
    !callsign
  ) {


    output.value =
      "";


    count.textContent =
      "Enter a callsign.";


    copyButton.disabled =
      true;


    downloadButton.disabled =
      true;


    return;

  }


  /* -----------------------------------------
     START / END TIMES
  ----------------------------------------- */


  const startSeconds =
    timeToSeconds(
      startValue
    );


  let endSeconds =
    timeToSeconds(
      endValue
    );


  /* -----------------------------------------
     MIDNIGHT CROSSING

     If the end time is before the start
     time, assume that the journey finishes
     on the following day.
  ----------------------------------------- */


  if (
    endSeconds <
    startSeconds
  ) {

    endSeconds +=
      24 *
      60 *
      60;

  }


  const duration =
    endSeconds -
    startSeconds;


  const numberOfPoints =
    storedCoordinates.length;


  /* -----------------------------------------
     CALCULATE INTERVAL

     N points have N-1 intervals.

     Therefore:

     first point = exact start time
     final point = exact end time
  ----------------------------------------- */


  let interval =
    0;


  if (
    numberOfPoints > 1
  ) {

    interval =
      duration /
      (
        numberOfPoints -
        1
      );

  }


  /* -----------------------------------------
     OUTPUT ROWS
  ----------------------------------------- */


  const rows =
    [];


  rows.push(
    "timestamp,utc,callsign,position,altitude,speed,direction"
  );


  storedCoordinates.forEach(
    (
      coordinate,
      index
    ) => {


      /* -------------------------------------
         TIME FOR THIS POINT
      ------------------------------------- */


      const exactSeconds =
        startSeconds +
        (
          interval *
          index
        );


      const currentSeconds =
        Math.round(
          exactSeconds
        );


      /* -------------------------------------
         DAY OFFSET

         Required for journeys crossing
         midnight.
      ------------------------------------- */


      const dayOffset =
        Math.floor(
          currentSeconds /
          (
            24 *
            60 *
            60
          )
        );


      /* -------------------------------------
         TIME OF DAY
      ------------------------------------- */


      const time =
        secondsToTime(
          currentSeconds
        );


      /* -------------------------------------
         DATE
      ------------------------------------- */


      const dateParts =
        journeyDate.split(
          "-"
        );


      const date =
        new Date(
          Date.UTC(

            Number(
              dateParts[0]
            ),

            Number(
              dateParts[1]
            ) - 1,

            Number(
              dateParts[2]
            ) +
            dayOffset

          )
        );


      const dateString =
        [

          date.getUTCFullYear(),

          String(
            date.getUTCMonth() + 1
          ).padStart(
            2,
            "0"
          ),

          String(
            date.getUTCDate()
          ).padStart(
            2,
            "0"
          )

        ].join(
          "-"
        );


      /* =====================================
         UTC

         Example:

         2026-09-16 15:22:53+00
      ===================================== */


      const utc =
        dateString +
        " " +
        time +
        "+00";


      /* =====================================
         TIMESTAMP

         Derive Unix timestamp in seconds
         directly from the UTC value.

         This produces an integer suitable
         for the bigint timestamp column.
      ===================================== */


      const isoUtc =
        dateString +
        "T" +
        time +
        "Z";


      const utcDate =
        new Date(
          isoUtc
        );


      const timestamp =
        Math.floor(
          utcDate.getTime() /
          1000
        );


      /* =====================================
         POSITION

         IMPORTANT:

         latitude,longitude

         Example:

         51.123456,-2.123456
      ===================================== */


      const position =
        coordinate.lat +
        "," +
        coordinate.lon;


      /* -------------------------------------
         CREATE ROW

         altitude  = empty
         speed     = empty
         direction = empty
      ------------------------------------- */


      rows.push(

        timestamp

        +

        ","

        +

        escapeField(
          utc
        )

        +

        ","

        +

        escapeField(
          callsign
        )

        +

        ","

        +

        escapeField(
          position
        )

        +

        ",,,"

      );

    }
  );


  /* -----------------------------------------
     DISPLAY RESULT
  ----------------------------------------- */


  output.value =
    rows.join(
      "\n"
    );


  let statusText =

    numberOfPoints.toLocaleString()

    +

    " journey rows generated • "

    +

    formatDuration(
      duration
    )

    +

    " journey duration";


  if (
    isReversed
  ) {

    statusText +=
      " • reversed";

  }


  count.textContent =
    statusText;


  copyButton.disabled =
    false;


  downloadButton.disabled =
    false;

}


/* =============================================
   TIME -> SECONDS
============================================= */


function timeToSeconds(
  value
) {


  const parts =
    value.split(
      ":"
    );


  const hours =
    Number(
      parts[0]
    ) || 0;


  const minutes =
    Number(
      parts[1]
    ) || 0;


  const seconds =
    Number(
      parts[2]
    ) || 0;


  return (

    hours *
    3600

    +

    minutes *
    60

    +

    seconds

  );

}


/* =============================================
   SECONDS -> HH:MM:SS
============================================= */


function secondsToTime(
  seconds
) {


  seconds =
    Math.round(
      seconds
    );


  const secondsInDay =
    24 *
    60 *
    60;


  /* -----------------------------------------
     Wrap around after midnight
  ----------------------------------------- */


  seconds =
    (
      (
        seconds %
        secondsInDay
      )

      +

      secondsInDay
    )

    %

    secondsInDay;


  const hours =
    Math.floor(
      seconds /
      3600
    );


  const minutes =
    Math.floor(
      (
        seconds %
        3600
      )
      /
      60
    );


  const secs =
    seconds %
    60;


  return [

    String(
      hours
    ).padStart(
      2,
      "0"
    ),

    String(
      minutes
    ).padStart(
      2,
      "0"
    ),

    String(
      secs
    ).padStart(
      2,
      "0"
    )

  ].join(
    ":"
  );

}


/* =============================================
   FORMAT JOURNEY DURATION
============================================= */


function formatDuration(
  seconds
) {


  seconds =
    Math.round(
      seconds
    );


  const hours =
    Math.floor(
      seconds /
      3600
    );


  const minutes =
    Math.floor(
      (
        seconds %
        3600
      )
      /
      60
    );


  const secs =
    seconds %
    60;


  return [

    String(
      hours
    ).padStart(
      2,
      "0"
    ),

    String(
      minutes
    ).padStart(
      2,
      "0"
    ),

    String(
      secs
    ).padStart(
      2,
      "0"
    )

  ].join(
    ":"
  );

}


/* =============================================
   ESCAPE OUTPUT FIELD
============================================= */


function escapeField(
  value
) {


  const stringValue =
    String(
      value
    );


  if (

    stringValue.includes(
      ","
    )

    ||

    stringValue.includes(
      '"'
    )

    ||

    stringValue.includes(
      "\n"
    )

  ) {


    return (

      '"'

      +

      stringValue.replace(
        /"/g,
        '""'
      )

      +

      '"'

    );

  }


  return stringValue;

}


/* =============================================
   REGENERATE WHEN JOURNEY DETAILS CHANGE
============================================= */


journeyDateInput.addEventListener(
  "change",
  generateOutput
);


startTimeInput.addEventListener(
  "change",
  generateOutput
);


endTimeInput.addEventListener(
  "change",
  generateOutput
);


callsignInput.addEventListener(
  "input",
  generateOutput
);


/* =============================================
   REVERSE DATA
============================================= */


reverseButton.addEventListener(
  "click",
  () => {


    if (
      storedCoordinates.length === 0
    ) {

      return;

    }


    /* -----------------------------------------
       Reverse the GPX coordinate order.

       We reverse ONLY the coordinates.

       generateOutput() then recalculates all
       UTC values and timestamps.

       Therefore the newly reversed first
       coordinate receives the original
       journey start time and the newly
       reversed final coordinate receives
       the original journey end time.
    ----------------------------------------- */


    storedCoordinates.reverse();


    isReversed =
      !isReversed;


    generateOutput();


    /* -----------------------------------------
       BUTTON FEEDBACK
    ----------------------------------------- */


    const normalText =
      isReversed
        ? "Restore Original Order"
        : "Reverse Data";


    reverseButton.textContent =
      isReversed
        ? "Reversed!"
        : "Restored!";


    setTimeout(
      () => {

        reverseButton.textContent =
          normalText;

      },
      1000
    );

  }
);


/* =============================================
   COPY
============================================= */


copyButton.addEventListener(
  "click",
  async () => {


    await navigator.clipboard.writeText(
      output.value
    );


    const originalText =
      copyButton.textContent;


    copyButton.textContent =
      "Copied!";


    setTimeout(
      () => {

        copyButton.textContent =
          originalText;

      },
      1200
    );

  }
);


/* =============================================
   DOWNLOAD TXT
============================================= */


downloadButton.addEventListener(
  "click",
  () => {


    const blob =
      new Blob(

        [
          output.value
        ],

        {
          type:
            "text/plain;charset=utf-8"
        }

      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      currentFilename +
      ".txt";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      url
    );

  }
);


/* =============================================
   CLEAR
============================================= */


clearButton.addEventListener(
  "click",
  () => {


    fileInput.value =
      "";


    journeyDateInput.value =
      "";


    startTimeInput.value =
      "";


    endTimeInput.value =
      "";


    callsignInput.value =
      "";


    storedCoordinates =
      [];


    isReversed =
      false;


    output.value =
      "";


    fileInfo.textContent =
      "";


    count.textContent =
      "";


    copyButton.disabled =
      true;


    downloadButton.disabled =
      true;


    reverseButton.disabled =
      true;


    reverseButton.textContent =
      "Reverse Data";


    currentFilename =
      "journey";

  }
);


</script>


</body>

</html>
