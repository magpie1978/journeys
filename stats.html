<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Journey Statistics</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="css/flights.css" />
  <link rel="stylesheet" href="css/stats.css" />
  

</head>

<body>

  <header id="statsHeader">
    <a href="flights2.html" class="back-link">← Back to map</a>
    <div class="stats-header-title">Journey Statistics</div>
  </header>

  <main id="statsPage">
    <div class="stats-grid">

      <!-- TOP LEFT -->
      <section class="stats-panel">
        <div class="panel-head">
          <div class="toggle-group">
            <button id="btnYear" class="toggle-btn active">Year</button>
            <button id="btnAllTime" class="toggle-btn">All Time</button>
          </div>
        
          <select id="metricSelector" class="stats-select">
            <option value="flights">Flights</option>
            <option value="miles">Miles</option>
            <option value="airlines">Airlines</option>
            <option value="countries">Countries</option>
          </select>
        </div>

        <div class="chart-fill">
          <canvas id="flightsByYearChart"></canvas>
        </div>
      </section>
      
      
      <!-- RIGHT (double height) -->
      <section class="stats-panel stats-panel--right">
        <!-- Fixed header -->
        <div class="panel-head">
          <h2>Flights per Airline by Year</h2>
        </div>
      
        <!-- Scrollable chart area -->
        <div class="airline-scroll">
          <canvas id="flightsPerAirlineYearChart"></canvas>
        </div>
      </section>


      
      <!-- BOTTOM LEFT -->
      <section class="stats-panel">
        <h2>Flights per Year per Airline</h2>
        <div class="chart-fill">
          <canvas id="flightsPerYearAirlineChart"></canvas>
        </div>
      </section>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/charts8.js"></script>

</body>
</html>
