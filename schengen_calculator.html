<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 Schengen Calendar</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --schengen: #14532d;
      --schengen-border: #22c55e;
      --non-schengen: #78350f;
      --non-schengen-border: #f59e0b;
      --default-day: #1e293b;
      --default-border: #475569;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
    }

    .wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 16px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .warning-card {
      border-color: #64748b;
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      line-height: 1.1;
    }

    .clicked-date-value {
      font-size: 20px;
    }

    .status-ok {
      color: #4ade80;
    }

    .status-over {
      color: #f87171;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 20px;
    }

    .month {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .month h2 {
      margin: 0 0 14px;
      font-size: 20px;
      text-align: center;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 6px 0;
      font-weight: bold;
    }

    .empty {
      min-height: 58px;
    }

    .day {
      min-height: 58px;
      border-radius: 12px;
      border: 1px solid var(--default-border);
      background: var(--default-day);
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      position: relative;
    }

    .day:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .day-number {
      font-size: 14px;
      font-weight: bold;
    }

    .day.schengen {
      background: var(--schengen);
      border-color: var(--schengen-border);
    }

    .day.non-schengen {
      background: var(--non-schengen);
      border-color: var(--non-schengen-border);
    }

    .day::after {
      content: attr(data-label);
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 6px;
      font-size: 10px;
      line-height: 1.1;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    

    @media (max-width: 1100px) {
      .calendar-grid {
        grid-template-columns: repeat(2, minmax(280px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .stats-bar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .wrapper {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>2027 Calendar</h1>
    <div class="subtitle">Click any day once for Schengen, again for Non-Schengen, and a third time to clear it.</div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="background: var(--default-day);"></span>Not Set</div>
      <div class="legend-item"><span class="legend-swatch" style="background: var(--schengen);"></span>Schengen</div>
      <div class="legend-item"><span class="legend-swatch" style="background: var(--non-schengen);"></span>Non-Schengen</div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Schengen Days Marked</div>
        <div class="stat-value" id="totalSchengenDays">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Highest 180-Day Rolling Total</div>
        <div class="stat-value" id="maxRollingTotal">0</div>
      </div>
      <div class="stat-card warning-card">
        <div class="stat-label">90/180 Status</div>
        <div class="stat-value" id="statusText">Within Limit</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Clicked Date</div>
        <div class="stat-value clicked-date-value" id="selectedDateText">None</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rolling Total For Clicked Date</div>
        <div class="stat-value" id="clickedRollingTotal">0</div>
      </div>
      <div class="stat-card warning-card">
        <div class="stat-label">Days Remaining</div>
        <div class="stat-value" id="daysRemaining">90</div>
      </div>
    </div>

    <div id="calendar" class="calendar-grid"></div>
  </div>

  <script>
    const year = 2027;
    const monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    const weekdayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    const calendarEl = document.getElementById('calendar');
    const totalSchengenDaysEl = document.getElementById('totalSchengenDays');
    const maxRollingTotalEl = document.getElementById('maxRollingTotal');
    const statusTextEl = document.getElementById('statusText');
    const selectedDateTextEl = document.getElementById('selectedDateText');
    const clickedRollingTotalEl = document.getElementById('clickedRollingTotal');
    const daysRemainingEl = document.getElementById('daysRemaining');
    

    const storageKey = 'schengen-calendar-2027';
    const selectedDateStorageKey = 'schengen-calendar-2027-selected-date';
    let selections = JSON.parse(localStorage.getItem(storageKey) || '{}');
    let selectedDateKey = localStorage.getItem(selectedDateStorageKey) || null;
    const statusCycle = ['', 'Schengen', 'Non-Schengen'];

    function getDateKey(monthIndex, day) {
      const month = String(monthIndex + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      return `${year}-${month}-${dayStr}`;
    }

    function getDisplayDate(dateKey) {
      const [y, m, d] = dateKey.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function getAllDateKeysInYear() {
      const keys = [];
      for (let month = 0; month < 12; month++) {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day++) {
          keys.push(getDateKey(month, day));
        }
      }
      return keys;
    }

    function getRollingCountForDate(dateKey) {
      const currentDate = new Date(dateKey + 'T00:00:00');
      let rollingCount = 0;

      for (const [schengenKey, value] of Object.entries(selections)) {
        if (value !== 'Schengen') continue;
        const schengenDate = new Date(schengenKey + 'T00:00:00');
        const diffDays = Math.floor((currentDate - schengenDate) / 86400000);
        if (diffDays >= 0 && diffDays <= 179) {
          rollingCount++;
        }
      }

      return rollingCount;
    }

    function calculateStats() {
      const dateKeys = getAllDateKeysInYear();
      const schengenSet = new Set(
        Object.entries(selections)
          .filter(([, value]) => value === 'Schengen')
          .map(([key]) => key)
      );

      let maxRolling = 0;

      for (const dateKey of dateKeys) {
        const rollingCount = getRollingCountForDate(dateKey);
        if (rollingCount > maxRolling) {
          maxRolling = rollingCount;
        }
      }

      const totalSchengen = schengenSet.size;
      totalSchengenDaysEl.textContent = totalSchengen;
      maxRollingTotalEl.textContent = maxRolling;
      statusTextEl.textContent = maxRolling > 90 ? 'Over Limit' : 'Within Limit';
      statusTextEl.classList.remove('status-ok', 'status-over');
      statusTextEl.classList.add(maxRolling > 90 ? 'status-over' : 'status-ok');

      if (selectedDateKey) {
        const rollingTotal = getRollingCountForDate(selectedDateKey);
        const remaining = 90 - rollingTotal;
        selectedDateTextEl.textContent = getDisplayDate(selectedDateKey);
        clickedRollingTotalEl.textContent = rollingTotal;
        daysRemainingEl.textContent = remaining;
        daysRemainingEl.classList.remove('status-ok', 'status-over');
        daysRemainingEl.classList.add(remaining < 0 ? 'status-over' : 'status-ok');
      } else {
        selectedDateTextEl.textContent = 'None';
        clickedRollingTotalEl.textContent = '0';
        daysRemainingEl.textContent = '90';
        daysRemainingEl.classList.remove('status-ok', 'status-over');
        daysRemainingEl.classList.add('status-ok');
      }
    }

    function renderCalendar() {
      calculateStats();
      calendarEl.innerHTML = '';

      for (let month = 0; month < 12; month++) {
        const monthCard = document.createElement('div');
        monthCard.className = 'month';

        const title = document.createElement('h2');
        title.textContent = monthNames[month];
        monthCard.appendChild(title);

        const weekdays = document.createElement('div');
        weekdays.className = 'weekdays';
        weekdayNames.forEach(name => {
          const wd = document.createElement('div');
          wd.className = 'weekday';
          wd.textContent = name;
          weekdays.appendChild(wd);
        });
        monthCard.appendChild(weekdays);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'days';

        const firstDay = new Date(year, month, 1);
        let startDay = firstDay.getDay();
        startDay = startDay === 0 ? 6 : startDay - 1; // convert Sunday=0 to Monday-first layout

        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          daysGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateKey = getDateKey(month, day);
          const status = selections[dateKey] || '';

          const dayEl = document.createElement('button');
          dayEl.className = 'day';
          if (status === 'Schengen') dayEl.classList.add('schengen');
          if (status === 'Non-Schengen') dayEl.classList.add('non-schengen');
          dayEl.setAttribute('data-date', dateKey);
          dayEl.setAttribute('data-label', status);
          if (dateKey === selectedDateKey) {
            dayEl.style.outline = '2px solid #f8fafc';
            dayEl.style.outlineOffset = '1px';
          }
          dayEl.innerHTML = `<span class="day-number">${day}</span>`;

          dayEl.addEventListener('click', () => cycleSelection(dateKey));
          daysGrid.appendChild(dayEl);
        }

        monthCard.appendChild(daysGrid);
        calendarEl.appendChild(monthCard);
      }
    }

    function cycleSelection(dateKey) {
      selectedDateKey = dateKey;
      localStorage.setItem(selectedDateStorageKey, selectedDateKey);

      const current = selections[dateKey] || '';
      const currentIndex = statusCycle.indexOf(current);
      const nextIndex = (currentIndex + 1) % statusCycle.length;
      const nextValue = statusCycle[nextIndex];

      if (nextValue) {
        selections[dateKey] = nextValue;
      } else {
        delete selections[dateKey];
      }

      localStorage.setItem(storageKey, JSON.stringify(selections));
      renderCalendar();
    }

    

    

    renderCalendar();
  </script>
</body>
</html>
